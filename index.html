<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양상훈 | 자기소개</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg-start: #F8FAFC;
    --bg-end: #E0F2FE;
    --accent: #0EA5E9;
    --text-main: #1E293B;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 44px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 20px 45px rgba(14, 165, 233, 0.15), 0 4px 12px rgba(15, 23, 42, 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 28px 55px rgba(14, 165, 233, 0.22), 0 8px 18px rgba(15, 23, 42, 0.08);
  }

  .avatar {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--accent), #38BDF8);
    color: #FFFFFF;
    font-size: 38px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
    margin-bottom: 24px;
  }

  .name {
    margin: 0 0 10px;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-main);
  }

  .intro {
    margin: 0 0 28px;
    font-size: 16px;
    line-height: 1.5;
    color: var(--text-main);
    opacity: 0.85;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
    list-style: none;
    padding: 0;
  }

  .tag {
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(14, 165, 233, 0.1);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(14, 165, 233, 0.25);
    cursor: default;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  .tag:hover {
    background: var(--accent);
    color: #FFFFFF;
    transform: translateY(-2px);
  }

  @keyframes tagRise {
    from {
      opacity: 0;
      transform: translateY(14px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card:hover .tag {
    animation: tagRise 0.45s ease both;
  }

  .card:hover .tag:nth-child(1) { animation-delay: 0s; }
  .card:hover .tag:nth-child(2) { animation-delay: 0.08s; }
  .card:hover .tag:nth-child(3) { animation-delay: 0.16s; }
  .card:hover .tag:nth-child(4) { animation-delay: 0.24s; }
  .card:hover .tag:nth-child(5) { animation-delay: 0.32s; }
  .card:hover .tag:nth-child(6) { animation-delay: 0.4s; }

  .socials {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    width: 100%;
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .social-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.25);
    color: var(--text-main);
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  .social-link svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .social-link:hover {
    background: var(--accent);
    color: #FFFFFF;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
  }

  .floating-dots {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    animation: floatDot linear infinite;
  }

  @keyframes floatDot {
    0% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(14px, -20px);
    }
    50% {
      transform: translate(-10px, -36px);
    }
    75% {
      transform: translate(-18px, -12px);
    }
    100% {
      transform: translate(0, 0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot {
      animation: none;
    }

    .card:hover .tag {
      animation: none;
    }
  }

  @media (max-width: 480px) {
    .card {
      padding: 40px 24px;
      border-radius: 22px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      font-size: 30px;
    }

    .name {
      font-size: 22px;
    }

    .intro {
      font-size: 15px;
    }

    .social-link {
      font-size: 15px;
      padding: 13px 16px;
    }
  }
</style>
</head>
<body>
  <div class="floating-dots" aria-hidden="true"></div>
  <main class="card">
    <div class="avatar">양</div>
    <h1 class="name">양상훈</h1>
    <p class="intro">코드와 커피, 운동을 좋아합니다</p>

    <ul class="tags">
      <li class="tag">커피</li>
      <li class="tag">운동</li>
    </ul>

    <ul class="socials">
      <li>
        <a class="social-link" href="https://github.com/thrkrif" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0.5C5.65 0.5 0.5 5.66 0.5 12.03c0 5.09 3.29 9.4 7.86 10.93.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.55-3.88-1.55-.52-1.34-1.28-1.7-1.28-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.78 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.4-5.25 5.69.41.36.78 1.08.78 2.17 0 1.57-.01 2.83-.01 3.22 0 .31.21.68.8.56A10.53 10.53 0 0 0 23.5 12.03C23.5 5.66 18.35.5 12 .5Z"/>
          </svg>
          GitHub
        </a>
      </li>
      <li>
        <a class="social-link" href="https://velog.io/@thrkrif" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2 3h4.2l5.3 12.6L16.8 3H21l-8.2 18H10.2L2 3Z"/>
          </svg>
          Velog
        </a>
      </li>
    </ul>
  </main>

  <script>
    const dotsContainer = document.querySelector('.floating-dots');
    const dotCount = 30;

    for (let i = 0; i < dotCount; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot';

      const size = Math.random() * 8 + 4;
      const opacity = (Math.random() * 0.35 + 0.15).toFixed(2);

      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${Math.random() * 100}%`;
      dot.style.top = `${Math.random() * 100}%`;
      dot.style.background = `rgba(14, 165, 233, ${opacity})`;
      dot.style.animationDuration = `${Math.random() * 12 + 12}s`;
      dot.style.animationDelay = `${Math.random() * -20}s`;

      dotsContainer.appendChild(dot);
    }
  </script>
</body>
</html>
